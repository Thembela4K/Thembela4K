<text x="270" y="230" fill="#c2d1c4" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">I built an assistant and dashboard that make live assessment records</text>
<text x="270" y="251" fill="#c2d1c4" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">easier to explore, with reports reviewed before export.</text>
