<text x="270" y="576" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Self-Directed Search System</text>
<text x="270" y="602" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">I connected sign-in, assessment, results and certificate download</text>
<text x="270" y="623" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">into one straightforward participant journey.</text>
