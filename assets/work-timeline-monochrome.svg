<text x="270" y="751" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">FINCORP Power BI Dashboards</text>
<text x="270" y="777" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">With the dashboard team, I checked source data and built Power BI</text>
<text x="270" y="798" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">pages that make KPIs and trends easier to explore.</text>
