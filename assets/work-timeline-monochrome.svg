<text x="54" y="93" fill="#101010" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Work, over time.</text>
<text x="943" y="92" fill="#6d6d6d" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">2024–2026  /  PROJECTS</text>
