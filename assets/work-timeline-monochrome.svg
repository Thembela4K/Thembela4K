<text x="270" y="875" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Estate Agents Management System</text>
<text x="270" y="901" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">I gave a property agency one place to manage tenants, rent,</text>
<text x="270" y="922" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">payments and arrears in its daily workflow.</text>
