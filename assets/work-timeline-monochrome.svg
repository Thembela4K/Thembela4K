<text x="270" y="423" fill="#535353" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="700" letter-spacing="1">DESKTOP SYSTEM</text>
<text x="270" y="452" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">DDW Gate Entry System</text>
<text x="270" y="478" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">I built an offline Windows app for visitor and contractor checks,</text>
<text x="270" y="499" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">entry decisions and a daily register staff can rely on.</text>
