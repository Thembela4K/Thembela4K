<text x="270" y="175" fill="#535353" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="700" letter-spacing="1">AI / ANALYTICS</text>
<text x="270" y="204" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">ESPPRA AI Assistant &amp; Operational Dashboard</text>
<text x="270" y="230" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">I built an assistant and dashboard that make live assessment records</text>
<text x="270" y="251" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">easier to explore, with reports reviewed before export.</text>
<path d="M 187 329 H 238" stroke="#b8b8b8" stroke-width="2"/>
<circle cx="187" cy="329" r="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<circle cx="187" cy="329" r="2" fill="#333333"/>
