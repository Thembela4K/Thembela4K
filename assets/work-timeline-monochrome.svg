<text x="270" y="1174" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Water Use Survey Reporting</text>
<text x="270" y="1200" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">I turned survey records into repeatable reports, working with</text>
<text x="270" y="1221" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">GIS colleagues to keep the summaries close to field data.</text>
