<text x="270" y="999" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Malkerns Municipal Web GIS</text>
<text x="270" y="1025" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">I helped publish ward maps on the council website so people</text>
<text x="270" y="1046" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">can explore them on a phone or desktop.</text>
