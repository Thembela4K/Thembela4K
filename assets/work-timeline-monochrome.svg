<path d="M 250 288 V 372" stroke="#2d2d2d" stroke-width="3" stroke-linecap="round"/>
<text x="270" y="299" fill="#535353" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="700" letter-spacing="1">OPERATIONS</text>
<text x="270" y="328" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Operations Core CRM</text>
<text x="270" y="354" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">I brought clients, finance, approvals and team tasks into one place</text>
<text x="270" y="375" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">so the team can follow everyday work from start to finish.</text>
<path d="M 187 453 H 238" stroke="#b8b8b8" stroke-width="2"/>
<circle cx="187" cy="453" r="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<circle cx="187" cy="453" r="2" fill="#333333"/>
